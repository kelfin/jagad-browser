name: check

on:
  push:
  pull_request:

jobs:
  patches-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pytest pyyaml shellcheck-py

      # Pristine Chromium files touched by the series (~1 MB), per version.
      - name: Cache shadow tree
        uses: actions/cache@v4
        with:
          path: .shadow
          key: shadow-${{ hashFiles('CHROMIUM_VERSION', 'patches/series') }}

      - name: Patches apply to CHROMIUM_VERSION
        run: python3 tools/shadow.py check

      - name: Unit tests
        run: pytest -v tests
